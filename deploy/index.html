<body>
<!-- Shown unless a script runs and adds .js to <html>. iOS Files previews HTML
     in Quick Look, which renders the markup but does NOT execute JavaScript —
     the symptom is an empty seat list and a Start button that does nothing. -->
<div id="nojs">
  <b data-i18n="nojs.title">This page needs JavaScript, and it is not running.</b>
  <p data-i18n="nojs.p1"></p>
  <p data-i18n="nojs.p2"></p>
</div>
<header>
  <h1>Blink</h1>
  <span class="sub" data-i18n="app.sub">Climbing the Ladder of Civilization · rules v0.22</span>
  <a class="back" href="/blink/" data-i18n="app.back">← Blink</a>
  <span class="right"><span data-i18n="app.round">round</span> <b id="roundno">0</b> <span id="endnote"></span></span>
  <nav class="hnav" id="hnav" aria-label="Game">
    <button id="undo" class="hbtn" disabled></button>
    <button id="restart" class="hbtn"></button>
    <button id="abort" class="hbtn"></button>
  </nav>
</header>

<div id="fx"></div>
<!-- Hot seat: with more than one person at the table the board must not be
     visible while the device changes hands. -->
<div id="pass" hidden>
  <div class="passcard">
    <span class="dot" id="pass-dot"></span>
    <p class="passto" id="pass-name"></p>
    <p class="hint" id="pass-note"></p>
    <button class="go big" id="pass-go" data-i18n="pass.ready">I'm ready</button>
  </div>
</div>
<div id="setup">
  <h2 data-i18n="setup.title">Set up a game</h2>
  <p class="lede" data-i18n="setup.lede"></p>

  <fieldset class="field">
    <legend data-i18n="setup.lang">Language</legend>
    <div class="seg flags" id="lang"></div>
  </fieldset>

  <!-- Players, who sits where, and how sharp they are: one decision, so one
       panel. The seat rows are the middle of it because that is the part a
       person actually thinks about. -->
  <fieldset class="field table-panel">
    <legend data-i18n="setup.table">The table</legend>

    <div class="sub">
      <span class="sublab" id="np-label" data-i18n="setup.players.lab">Players</span>
      <div class="seg" id="n-players" role="group" aria-labelledby="np-label">
        <input type="radio" name="np" id="np-2" value="2"><label for="np-2">2</label>
        <input type="radio" name="np" id="np-3" value="3" checked><label for="np-3">3</label>
        <input type="radio" name="np" id="np-4" value="4"><label for="np-4">4</label>
      </div>
    </div>

    <div id="seats"></div>
    <p class="hint" id="seats-note"></p>

    <div class="sub">
      <span class="sublab" id="lv-label" data-i18n="setup.level.lab">Sharpness</span>
      <div class="seg" id="bot-level" role="group" aria-labelledby="lv-label">
        <input type="radio" name="lv" id="lv-easy" value="easy"><label for="lv-easy"
          data-i18n="setup.level.easy.short">Easy</label>
        <input type="radio" name="lv" id="lv-normal" value="normal" checked><label for="lv-normal"
          data-i18n="setup.level.normal.short">Normal</label>
        <input type="radio" name="lv" id="lv-hard" value="hard"><label for="lv-hard"
          data-i18n="setup.level.hard.short">Hard</label>
      </div>
    </div>
    <p class="hint" id="level-note"></p>
  </fieldset>

  <div class="field">
    <label for="seed" data-i18n="setup.seed">Seed</label>
    <div class="seedrow">
      <input id="seed" type="number" value="1" inputmode="numeric" aria-describedby="seed-note">
      <button type="button" id="reseed" data-i18n="setup.reseed" data-i18n-attr="title"
        title="New seed" aria-label="New seed">⟳</button>
    </div>
    <p class="hint" id="seed-note" data-i18n="setup.seed.note"></p>
  </div>

  <details id="advanced">
    <summary><span class="chev" aria-hidden="true"></span><span
      data-i18n="setup.advanced">Advanced rules</span></summary>
    <p class="hint" data-i18n="setup.advanced.note"></p>

    <div class="field">
      <label for="trick-rule" data-i18n="setup.trick">Trick resolution</label>
      <select id="trick-rule">
        <option value="dock" selected data-i18n="setup.trick.dock"></option>
        <option value="bonus" data-i18n="setup.trick.bonus"></option>
      </select>
    </div>
    <div class="field">
      <label for="deck" data-i18n="setup.deck">Card effects</label>
      <select id="deck">
        <option value="abc" selected data-i18n="setup.deck.abc"></option>
        <option value="abd" data-i18n="setup.deck.abd"></option>
      </select>
    </div>
    <div class="field">
      <label for="meld-rules" data-i18n="setup.meldRules">Meld variants</label>
      <select id="meld-rules">
        <option value="off" selected data-i18n="setup.meldRules.off"></option>
        <option value="combo" data-i18n="setup.meldRules.combo"></option>
        <option value="friends" data-i18n="setup.meldRules.friends"></option>
        <option value="both" data-i18n="setup.meldRules.both"></option>
      </select>
    </div>
    <div class="field">
      <label for="grow-limits" data-i18n="setup.limits">Population limits</label>
      <select id="grow-limits">
        <option value="off" selected data-i18n="setup.limits.off"></option>
        <option value="grow" data-i18n="setup.limits.grow"></option>
      </select>
    </div>
    <div class="field">
      <label for="retire-rule" data-i18n="setup.retire">Research retires</label>
      <select id="retire-rule">
        <option value="lowest" selected data-i18n="setup.retire.lowest"></option>
        <option value="any" data-i18n="setup.retire.any"></option>
      </select>
    </div>
    <div class="field">
      <label for="objectives" data-i18n="setup.objectives">Map objectives</label>
      <select id="objectives">
        <option value="off" selected data-i18n="setup.objectives.off"></option>
        <option value="secret" data-i18n="setup.objectives.secret"></option>
        <option value="open" data-i18n="setup.objectives.open"></option>
        <option value="both" data-i18n="setup.objectives.both"></option>
      </select>
    </div>
  </details>

  <button class="go big" id="start" data-i18n="setup.start">Start</button>

  <nav class="docs" aria-labelledby="docs-label">
    <span class="sublab" id="docs-label" data-i18n="setup.docs">Read the rules</span>
    <a class="doclink" id="doc-rules" href="rulebook.html" target="_blank" rel="noopener"
      data-i18n="setup.docs.rules">Rulebook</a>
    <a class="doclink" id="doc-effects" href="card-effects.html" target="_blank" rel="noopener"
      data-i18n="setup.docs.effects">Card effects</a>
    <a class="doclink" id="doc-objectives" href="map-objectives.html" target="_blank" rel="noopener"
      data-i18n="setup.docs.objectives">Map objectives</a>
  </nav>

  <!-- Which build this is. A playtest report that cannot name its version is
       an anecdote, so the version is on the page, not buried in a comment. -->
  <p class="buildline" id="buildline"></p>
</div>

<div id="game">
  <div class="wrap">
    <div id="market"></div>
    <div id="mapbox">
      <div id="maptop">
        <div id="turnbar"></div>
        <div id="legend">
          <i style="background:#C9992B" title="Plains — holds 3"></i>3
          <i style="background:#37704A" title="Forest — holds 2"></i>2
          <i style="background:#256A8C" title="Ocean — holds 1"></i>1
          <i style="background:#8A837A" title="Mountain — holds 1"></i>1
        </div>
        <div id="zoom"><button id="zout" title="zoom out">−</button
          ><button id="zin" title="zoom in">+</button
          ><button id="zfit" title="show the whole board · press again for playing size"
            >⤢</button></div>
      </div>
      <div id="corners"></div>
      <svg id="map"></svg>
      <div id="mymeld"></div>
    </div>
    <div class="lower">
      <div id="prompt"></div>
      <div id="hand"></div>
      <div id="player"></div>
      <div id="log"></div>
